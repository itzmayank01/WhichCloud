[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whichcloud"
version = "0.1.0"
description = "Constraint-driven multi-cloud architecture synthesis and cost optimization"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "PyYAML>=6.0",
    "anthropic>=0.116",
    "pydantic>=2.0",
    "google-genai>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["whichcloud*"]
