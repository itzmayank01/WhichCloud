# Fixture 4 -- proves rung 1 is conditional, not unconditional. The
# previous task made Multi-AZ and cross-region mandatory under
# availability=high and durability=high; this proves those stay OFF when
# the workload never asked for them.
id: internal-low-stakes
prompt: >
  small internal tool for our 12-person ops team to track equipment. About
  200 page views a day. If it is down for an hour nobody minds. We want to
  spend as little as possible, maybe $60 a month.

expect:
  extraction:
    availability: {value: low, source: stated}
    durability: {value: normal, source: assumed}
    # NOTE: the task spec said "assumed" here too (same pattern as
    # Fixture 1). "internal tool" and "our ... ops team" are textual
    # evidence for not-public-facing, so this is "stated" under the same
    # rule that made Fixture 1's public_facing stated. See that fixture's
    # note and the harness's own report for this discrepancy.
    public_facing: {value: false, source: stated}

  network_topology: public_simple

  # cross_region_backup_copy stays excluded, but for a narrower reason
  # than before: durability=normal now DOES take backups (7-day
  # retention). What it does not buy is surviving loss of the whole
  # region -- a second copy elsewhere and object lock. Being offline for
  # an hour and losing the data are independent axes, and the old ladder
  # read the first as consent to skip the second.
  must_exclude:
    - multi_az_database
    - cross_region_backup_copy
    - load_balancer
    - waf
    - cdn
    - cache
    - read_replica
    - nat_gateway
    - vpc_flow_logs

  must_include:
    - component: backup
      tiers: [tier_1, tier_2, tier_3]

  # Now passes: storage/egress defaults scale by load band and headcount
  # instead of a flat 500 GB / 100 GB, so a 12-person tool is assumed to
  # hold 31 GB rather than the same as a 450-staff hospital. Tier 1 is
  # $45.89 against the $60 budget.
  budget:
    tier_1: true

  invariants: [all]
