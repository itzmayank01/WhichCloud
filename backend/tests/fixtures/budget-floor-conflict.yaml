# Fixture 6 -- proves the engine refuses to silently degrade a design to
# hit a number. Tier 1's own floor is well above the stated budget; the
# correct behaviour is to say so, not to quietly drop Multi-AZ or the
# cross-region copy to bring the number down.
id: budget-floor-conflict
prompt: >
  patient records system for a clinic in Jaipur. Cannot lose data, cannot
  have downtime. Budget is $80 a month.

# Extracted from the prompt above by the pinned primary under schema v2
# and recorded verbatim -- NOT hand-written. Earlier versions of this
# block were typed by hand and had invented values in them (a request
# rate the prompt never gave, a single country for a three-country
# marketplace), which meant part of the golden baseline rested on
# numbers no extractor ever produced.
constraints:
  country: IN
  sector: healthcare
  availability: high
  durability: high
  users: 0
  requests_per_day: 0
  peak_shape: flat
  budget_monthly_usd: 80.0
  storage_gb: 0.0
  egress_gb: 0.0
  public_facing: false
  country_lock: false
  static_assets: none
  emails_per_month: 0
  async_processing: false
  content_storage_gb: 0.0
  user_data_gb: 0.0
  archetype: web_app
  stated: [availability, budget_monthly_usd, country, durability, sector]

expect:
  budget:
    tier_1: false

  over_budget_note_contains: "Your requirements set a floor above your budget."

  must_include:
    - component: multi_az_database
      tiers: [tier_1]
    - component: cross_region_backup_copy
      tiers: [tier_1]

  invariants: [all]
