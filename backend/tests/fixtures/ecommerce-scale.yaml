# Fixture 3 -- proves the gates can say YES. The previous task's fix
# stopped Tier 1 from buying a cache/replica it never needed; the failure
# mode this fixture catches is the opposite one, where that same
# tightening also stops Tier 2/3 from buying what a genuinely large
# workload actually needs.
id: ecommerce-scale
prompt: >
  A consumer marketplace, customers across India, Singapore and UAE, about
  2 million requests a day with evening peaks, product images and video,
  checkout must not go down, budget around $4,000 a month.

# Extracted from the prompt above by the pinned primary under schema v2
# and recorded verbatim -- NOT hand-written. Earlier versions of this
# block were typed by hand and had invented values in them (a request
# rate the prompt never gave, a single country for a three-country
# marketplace), which meant part of the golden baseline rested on
# numbers no extractor ever produced.
constraints:
  country: ''
  sector: ecommerce
  availability: high
  durability: high
  users: 0
  requests_per_day: 2000000
  peak_shape: evening
  budget_monthly_usd: 4000.0
  storage_gb: 0.0
  egress_gb: 0.0
  public_facing: true
  country_lock: false
  static_assets: heavy
  emails_per_month: 0
  async_processing: false
  content_storage_gb: 0.0
  user_data_gb: 0.0
  archetype: web_app
  stated: [availability, budget_monthly_usd, peak_shape, requests_per_day]

expect:
  sizing:
    avg_rps: 23
    peak_rps: 230
    load_tier: medium

  must_include:
    - component: cdn
      tiers: [tier_2, tier_3]
    - component: waf
      tiers: [tier_1, tier_2, tier_3]
    - component: cache
      tiers: [tier_2, tier_3]
    - component: read_replica
      tiers: [tier_2, tier_3]
    - component: autoscaling_compute
      tiers: [tier_2, tier_3]
    - component: multi_az_database
      tiers: [tier_1, tier_2, tier_3]

  must_exclude: []

  budget:
    tier_1: true
    tier_2: true
    tier_3: true

  invariants: [all]
