# Fixture 5 -- proves compliance is a (country, sector) table lookup, not
# a hardcoded India-healthcare block. Same country as Fixture 1, different
# sector, and the regulation set changes accordingly.
id: fintech-bengaluru
prompt: >
  lending platform in Bengaluru, 80,000 loan applications a month, KYC
  documents and repayment records, RBI audits us, data must remain in
  India, budget $3,000 a month.

# Extracted from the prompt above by the pinned primary under schema v2
# and recorded verbatim -- NOT hand-written. Earlier versions of this
# block were typed by hand and had invented values in them (a request
# rate the prompt never gave, a single country for a three-country
# marketplace), which meant part of the golden baseline rested on
# numbers no extractor ever produced.
constraints:
  country: IN
  sector: fintech
  availability: low
  durability: high
  users: 0
  requests_per_day: 2667
  peak_shape: flat
  budget_monthly_usd: 3000.0
  storage_gb: 0.0
  egress_gb: 0.0
  public_facing: true
  country_lock: true
  static_assets: none
  emails_per_month: 0
  async_processing: false
  content_storage_gb: 0.0
  user_data_gb: 0.0
  archetype: web_app
  stated: [budget_monthly_usd, country, durability, requests_per_day, sector]

expect:
  extraction:
    country: {value: IN, source: stated}
    sector: {value: fintech, source: stated}
    durability: {value: high, source: stated}

  compliance:
    - "RBI Storage of Payment System Data directive"
    - "Digital Personal Data Protection Act 2023"

  forbidden:
    - HIPAA
    - ABDM

  must_include:
    - component: cross_region_backup_copy
      tiers: [tier_1, tier_2, tier_3]
    - component: object_lock
      tiers: [tier_1, tier_2, tier_3]
    - component: extended_retention_audit
      tiers: [tier_1, tier_2, tier_3]

  invariants: [all]
