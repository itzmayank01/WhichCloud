# Fixture for budget-aware architecture fix & budget ladder
id: retail-chain
prompt: >
  I run operations for a retail chain in India with 40 stores. We want to move
  our stock and billing system online so staff can use it from any store and head
  office can see live numbers. Around 300 staff use it daily and we do about
  8,000 transactions a day. It must not go down during business hours because
  billing stops. Budget is around $5000 a month.

constraints:
  country: IN
  sector: retail
  availability: high
  availability_class: business_hours
  durability: medium
  users: 300
  requests_per_day: 8000
  peak_shape: business_hours
  budget_monthly_usd: 5000.0
  storage_gb: 100.0
  egress_gb: 50.0
  public_facing: false
  country_lock: true
  static_assets: none
  emails_per_month: 0
  async_processing: false
  content_storage_gb: 0.0
  user_data_gb: 0.0
  archetype: web_app
  stated: [availability, budget_monthly_usd, country, requests_per_day, users]

budgets:
  - 500
  - 2000
  - 5000
  - 20000

