# Render's free plan stops the engine after 15 minutes without a request, and
# the next visitor waits 30-60s while it boots -- on /connect/aws that read as a
# page that never loads. A request every 10 minutes keeps it up. One always-on
# free service uses ~730 of the 750 free instance-hours Render gives a month.
#
# GitHub may delay scheduled runs by several minutes under load, so the
# frontend also pings /health on first page view (components/BackendWarmup).
name: Keep backend warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://whichcloud-backend.onrender.com/health) || true
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          exit 1
