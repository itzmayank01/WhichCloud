# Render Blueprint for the FastAPI engine. Deploy via Render's dashboard:
# New -> Blueprint -> this repo. Render reads this file to configure the
# service; every secret below is declared with `sync: false` so Render
# prompts for it in the dashboard instead of expecting a value here --
# nothing that touches a real credential belongs committed to git.
#
# Free plan: sleeps after 15 min idle, ~30-60s cold start on the next
# request. Acceptable pre-launch; revisit (Railway, or a paid Render plan)
# once there's real traffic that can't tolerate that. See DEPLOY.md.
services:
  - type: web
    name: whichcloud-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      # Postgres connection string (Neon). This app reads WHICHCLOUD_DSN,
      # not DATABASE_URL -- Neon's own naming does not apply here.
      - key: WHICHCLOUD_DSN
        sync: false
      # Optional -- the engine works without it, just slower per DEPLOY.md.
      - key: WHICHCLOUD_REDIS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Required for any route that verifies a caller's identity (saved
      # architectures, FinOps, connections) -- see auth.py. No default on
      # purpose: unset must fail closed, not silently verify nothing.
      - key: CLERK_JWKS_URL
        sync: false
      - key: CLERK_AUTHORIZED_PARTIES
        sync: false
      # FinOps Live currently runs on ONE shared set of AWS credentials
      # (see connections/aws_live.py), not per-tenant ones -- this
      # allow-list is the only thing standing between "signed in" and
      # "can see/control the real AWS account below". Empty denies
      # everyone; see backend/whichcloud/auth.py for the full story.
      - key: WHICHCLOUD_FINOPS_OWNERS
        sync: false
      # The deployed frontend's origin(s), comma separated. Set once the
      # Vercel domain is known -- see DEPLOY.md step 4.
      - key: WHICHCLOUD_ALLOWED_ORIGINS
        sync: false
      - key: WHICHCLOUD_ALLOWED_ORIGIN_REGEX
        sync: false
      # Read directly by the `aws` CLI at runtime (connections/aws_live.py
      # shells out to it) -- never baked into the image.
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        sync: false
