AWSTemplateFormatVersion: '2012-10-17'
Description: 'WhichCloud Read-Only Cross-Account Cost Explorer Role'

Parameters:
  ExternalId:
    Type: String
    Description: 'The external id WhichCloud generated for this connection. Get this from the Connect AWS page -- do not reuse one from another connection.'
    AllowedPattern: '.+'
  TrustedAccountId:
    Type: String
    Description: 'The AWS account WhichCloud runs as. Get this from the Connect AWS page -- this is what makes the role assumable only by WhichCloud, not by an arbitrary caller.'
    AllowedPattern: '^[0-9]{12}$'

Resources:
  WhichCloudCostRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: 'WhichCloudCostRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${TrustedAccountId}:root'
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'sts:ExternalId': !Ref ExternalId
      Policies:
        - PolicyName: 'WhichCloudCostExplorerReadOnly'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Matches connections/aws.py's POLICY_ACTIONS exactly. This role
              # cannot see resources or read data -- only Cost Explorer's own
              # totals -- because that is the only thing this grant promises.
              - Effect: Allow
                Action:
                  - 'ce:GetCostAndUsage'
                  - 'ce:GetDimensionValues'
                Resource: '*'

Outputs:
  RoleArn:
    Description: 'The ARN of the created WhichCloud Role -- paste this back into WhichCloud if it is not detected automatically.'
    Value: !GetAtt WhichCloudCostRole.Arn
