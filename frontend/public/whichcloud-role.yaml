AWSTemplateFormatVersion: '2012-10-17'
Description: 'WhichCloud Read-Only Cross-Account Cost Explorer Role'

Parameters:
  ExternalId:
    Type: String
    Description: 'Unique External ID generated by WhichCloud'
    Default: 'whichcloud-sec-8a9021b3'

Resources:
  WhichCloudCostRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: 'WhichCloudCostRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: 'arn:aws:iam::124398214412:root'
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'sts:ExternalId': !Ref ExternalId
      Policies:
        - PolicyName: 'WhichCloudCostExplorerReadOnly'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'ce:GetCostAndUsage'
                  - 'ce:GetDimensionValues'
                  - 'ce:GetCostForecast'
                  - 'ce:GetSavingsPlansUtilization'
                  - 'cloudwatch:GetMetricData'
                  - 'cloudwatch:ListMetrics'
                  - 'ec2:DescribeInstances'
                  - 'ec2:DescribeVolumes'
                  - 'rds:DescribeDBInstances'
                Resource: '*'

Outputs:
  RoleArn:
    Description: 'The ARN of the created WhichCloud Role'
    Value: !GetAtt WhichCloudCostRole.Arn
